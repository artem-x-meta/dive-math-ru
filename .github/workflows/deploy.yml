name: Сборка и публикация на GitHub Pages

on:
  push:
    branches: [main]
  # Позволяет запустить публикацию вручную со вкладки Actions.
  workflow_dispatch:

# Разрешения, которых требует публикация на Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только одна публикация; лишние запуски в очереди отменяются.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  proverka:
    name: Тесты и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Типы
        run: npx astro check

      - name: Тесты
        run: npm test

  sborka:
    name: Сборка сайта
    needs: proverka
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Даёт адрес и подпуть, по которым Pages отдаёт этот репозиторий.
      - uses: actions/configure-pages@v5
        id: pages

      - name: Сборка
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publikatsiya:
    name: Публикация
    needs: sborka
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
