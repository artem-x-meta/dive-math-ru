name: Проверка Lean-примеров

# Запускается только когда меняется сам Lean-проект или страницы курса:
# сборка с Mathlib занимает минуты, и тормозить ею публикацию книги незачем.
on:
  push:
    branches: [main]
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'lean/**'
  workflow_dispatch:

jobs:
  lake-build:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ставит elan и тулчейн, указанный в lean/lean-toolchain.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          test: false
          lint: false
